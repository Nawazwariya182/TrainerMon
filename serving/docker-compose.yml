version: '3.8'

services:
  trainermon-serving:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainermon-diagnostic-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../harmonized_manifest.json:/app/harmonized_manifest.json:ro
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
