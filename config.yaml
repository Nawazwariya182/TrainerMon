training:
  batch_size: 64
  effective_batch_size: 64
  gradient_accumulation_steps: 1
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  mixed_precision: "bf16"
  channels_last: true
  cudnn_benchmark: true
  fused_optimizer: true
  lr: 0.0035
  warmup_epochs: 4
  max_epochs: 25

optimizer:
  name: "AdamW"
  lr: 0.0025
  weight_decay: 0.015
  warmup_epochs: 20
  lr_schedule: "cosine"

loss:
  type: "FocalLoss"
  gamma: 3.0
  label_smoothing: 0.15

model:
  num_classes: 4
  dropout_rate: 0.25